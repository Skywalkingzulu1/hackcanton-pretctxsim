version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: pretxsim_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pretxsim:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pretxsim_proxy
    ports:
      - "8545:8545"
    environment:
      - RPC_URL=
      - RUST_LOG=info
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  ollama_data:
